apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: bui-kitchen-sink-demo
  title: BUI Kitchen Sink Demo
  description: Exercises every widget and field extension in the BUI scaffolder form theme
spec:
  owner: backstage/techdocs-core
  type: service

  parameters:
    - title: Basic widgets
      required:
        - name
        - email
      properties:
        name:
          title: Name
          type: string
          description: Plain text input via BaseInputTemplate
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Multiline textarea
          ui:widget: textarea
          ui:options:
            rows: 3
        email:
          title: Email
          type: string
          format: email
          description: Uses the email widget
        website:
          title: Website
          type: string
          format: uri
          description: Uses the url widget
        password:
          title: Password
          type: string
          ui:widget: password
          description: Uses the password widget
        favouriteColour:
          title: Favourite colour
          type: string
          ui:widget: color
          description: Uses the color widget
        secret:
          title: Hidden token
          type: string
          ui:widget: hidden
          default: hidden-default-value

    - title: Numbers, ranges and toggles
      properties:
        replicas:
          title: Replicas
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Plain integer input
        confidence:
          title: Confidence
          type: number
          minimum: 0
          maximum: 100
          default: 50
          ui:widget: range
          description: Uses the range widget
        enabled:
          title: Enabled
          type: boolean
          default: true
          description: Single boolean checkbox
        consent:
          title: Consent
          type: boolean
          default: false
          ui:widget: radio
          oneOf:
            - const: true
              title: I agree
            - const: false
              title: I disagree

    - title: Selects and groups
      properties:
        environment:
          title: Environment
          type: string
          enum:
            - development
            - staging
            - production
          default: development
          description: Single-select dropdown
        region:
          title: Region
          type: string
          enum:
            - eu-west-1
            - us-east-1
            - ap-southeast-2
          ui:widget: radio
          description: Radio group via oneOf
        features:
          title: Features
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - logging
              - metrics
              - tracing
              - profiling
          ui:widget: checkboxes
          description: Checkbox group via checkboxes widget
        tags:
          title: Free-form tags
          type: array
          items:
            type: string
          description: Default array input

    - title: Dates and files
      properties:
        startDate:
          title: Start date
          type: string
          format: date
          description: Uses the date widget
        startDateTime:
          title: Start time
          type: string
          format: date-time
          description: Uses the date-time widget
        cutoffTime:
          title: Cutoff time
          type: string
          format: time
          description: Uses the time widget
        readme:
          title: Readme upload
          type: string
          format: data-url
          description: Uses the file widget

    - title: Nested objects and arrays
      properties:
        owner:
          title: Owner profile
          type: object
          required:
            - displayName
          properties:
            displayName:
              title: Display name
              type: string
            slack:
              title: Slack handle
              type: string
        contacts:
          title: Contacts
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                title: Name
                type: string
              role:
                title: Role
                type: string
                enum:
                  - PM
                  - Engineer
                  - Designer
              primary:
                title: Primary contact
                type: boolean

    # Added for the adoption exercise, copied verbatim (title and comment
    # included) from "Use parameters as conditional for fields" in
    # docs/features/software-templates/input-examples.md. The kitchen sink
    # carries no `dependencies` of its own, and neither does any other template
    # in the backstage organisation.
    - title: Fill in some steps
      properties:
        includeName:
          title: Include Name?
          type: boolean
          default: true

      dependencies:
        includeName:
          allOf:
            - if:
                properties:
                  includeName:
                    const: true
              then:
                properties:
                  lastName:
                    title: Last Name
                    type: string
                # You can use additional fields of parameters within conditional parameters such as required.
                required:
                  - lastName

    - $yaml: https://github.com/texaryn/texaryn/blob/main/spikes/backstage-adoption/template/parameters-pickers.yaml

  steps:
    - id: log
      name: Log
      action: debug:log
      input:
        message: |
          Submitted kitchen sink for ${{ parameters.name }}.
          Environment: ${{ parameters.environment }}
          Owner: ${{ parameters.ownerRef }}
          Repo: ${{ parameters.repoUrl }}

  output:
    text:
      - title: Summary
        content: |
          **Name:** ${{ parameters.name }}
          **Environment:** ${{ parameters.environment }}
          **Region:** ${{ parameters.region }}
          **Features:** ${{ parameters.features }}
