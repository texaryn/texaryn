  'brace-expansion@^5.0.0': 5.0.12
  devalue: 5.9.3
  dompurify: 3.4.17
  fast-copy: 4.1.0
  'fast-uri@^3.0.1': 3.1.9
  'fast-uri@^4.0.0': 4.2.3
  launch-editor: 2.14.2
  markdown-it: 14.3.3
  postcss-selector-parser: 7.1.6
  sharp: 0.35.5
  shell-quote: 1.11.0
  smol-toml: 1.9.0
  source-map-js: 1.2.2
  undici: 8.12.2
  'vite@^8.0.0': 8.2.4
  zod: 4.6.7
