version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        # React 19.3 adds 8.6 KB gzipped to the playground initial bundle, past
        # its 175 KB budget, so React arrives in its own pull request.
        exclude-patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
    ignore:
      # @angular/compiler-cli 20 sets the @texaryn/angular peer floor and
      # rejects TypeScript 6, so TypeScript majors move by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types follow the runtime major in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Angular 20 is the @texaryn/angular build and peer floor.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      # @texaryn/hints-rjsf converts RJSF 5.24.13 uiSchemas (ADR-006).
      - dependency-name: "@rjsf/utils"
        update-types: ["version-update:semver-major"]
      # @texaryn/solid peers solid-js ^1.9, and the stable vite-plugin-solid
      # 2.11 cannot compile Solid 2, so solid-js majors move by hand.
      - dependency-name: solid-js
        update-types: ["version-update:semver-major"]
      # 1.18.1 fails to compile $id values that are Windows file URIs, which
      # drops 4 mandatory JSON Schema Test Suite passes in every draft.
      - dependency-name: "@hyperjump/json-schema"
        versions: ["1.18.1"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
