version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    ignore:
      # @angular/compiler-cli 20 sets the @texaryn/angular peer floor and
      # rejects TypeScript 6, so TypeScript majors move by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types follow the runtime major in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
