version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @angular/compiler-cli 20 sets the @texaryn/angular peer floor and
      # rejects TypeScript 6, so TypeScript majors move by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types follow the runtime major in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Angular 20 is the @texaryn/angular build and peer floor.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      # @texaryn/hints-rjsf converts RJSF 5.24.13 uiSchemas (ADR-006).
      - dependency-name: "@rjsf/utils"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
