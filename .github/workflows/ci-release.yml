name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Verify docs
        run: pnpm docs:check
      - name: Verify packages
        run: pnpm verify:packages
      # Builds and composes the site but deploys nothing. Two checkers run
      # over it: the docs build fails on a broken link within its own pages,
      # and check-site-links fails on a link between the two applications,
      # which is the seam neither build can see on its own. It runs here
      # rather than only in the Pages workflow because that one is post-merge,
      # so a broken link would already be live by the time it spoke.
      - name: Build and check the site
        run: pnpm site:build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - name: Upload coverage to Codecov
        # Fork pull requests receive no id-token, so an OIDC upload from them can only fail.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          fail_ci_if_error: true

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check changeset
        run: pnpm changeset status --since=${{ github.event.pull_request.base.sha }}

  ci:
    name: CI Gate
    needs: [build, typecheck, test, changeset]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.changeset.result }}" != "success" && "${{ needs.changeset.result }}" != "skipped" ]]; then exit 1; fi

  changesets:
    if: ${{ !cancelled() && github.event_name == 'push' && needs.ci.result == 'success' }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should-publish: ${{ steps.changesets.outputs['has-changesets'] == 'false' && steps.registry.outputs.should-publish == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          pr-title: "Version Packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No pending changesets does not mean something is unpublished. Publish
      # only when the registry lacks an exact package.json version, or cannot say.
      - name: Check the registry for unpublished versions
        id: registry
        if: steps.changesets.outputs['has-changesets'] == 'false'
        run: node scripts/check-unpublished-packages.mjs

  publish:
    if: ${{ !cancelled() && needs.changesets.result == 'success' && needs.changesets.outputs.should-publish == 'true' }}
    needs: changesets
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      # .nvmrc pins only the Node major, so the bundled npm drifts with the
      # runner image. Trusted publishing needs npm 11.5.1 or later; npm 12
      # changes publish behaviour and is not adopted implicitly.
      - name: Pin npm for publishing
        run: npm install --global npm@11.19.1
      - run: pnpm build
      - id: publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          create-github-releases: false
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      # Reconciles GitHub releases with what is published. The action output
      # only describes this execution, so a rerun after npm already succeeded
      # reports nothing; the package tags on this commit are the retry source.
      # No release claims "latest": packages version independently, so the
      # badge would land on whichever happened to publish last. The npm
      # dist-tag is the authoritative latest, per package.
      - name: Reconcile GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
        run: |
          set -euo pipefail
          RELEASE_TAGS=$(git tag --points-at "$GITHUB_SHA")
          export RELEASE_TAGS
          node scripts/release-plan.mjs > release-plan.json

          count=$(jq 'length' release-plan.json)
          echo "planned releases: $count"
          # seq 0 -1 is not empty on every platform, and an out-of-range index
          # would reach gh as the string "null".
          if [ "$count" -eq 0 ]; then
            echo "nothing to reconcile"
            exit 0
          fi

          for i in $(seq 0 $((count - 1))); do
            tag=$(jq -r ".[$i].tag" release-plan.json)
            title=$(jq -r ".[$i].title" release-plan.json)
            prerelease=$(jq -r ".[$i].prerelease" release-plan.json)
            jq -r ".[$i].notes" release-plan.json > .github-release-notes.md

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "updating release $tag"
              gh release edit "$tag" \
                --title "$title" \
                --notes-file .github-release-notes.md \
                --prerelease="$prerelease" \
                --latest=false
            else
              echo "creating release $tag"
              gh release create "$tag" \
                --title "$title" \
                --notes-file .github-release-notes.md \
                --prerelease="$prerelease" \
                --latest=false
            fi
          done
