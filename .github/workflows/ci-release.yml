name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Verify package exports
        run: |
          pnpm --filter @texaryn/core exec node -e "import('@texaryn/core')"
          pnpm --filter @texaryn/schema-json exec node -e "import('@texaryn/schema-json')"
          pnpm --filter @texaryn/react exec node -e "import('@texaryn/react')"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  ci:
    name: CI Gate
    needs: [build, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks passed"

  changesets:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should-publish: ${{ steps.changesets.outputs['has-changesets'] == 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          pr-title: "Version Packages (alpha)"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: needs.changesets.outputs.should-publish == 'true'
    needs: changesets
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - run: pnpm build
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          create-github-releases: true
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
