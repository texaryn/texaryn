name: JSON Schema library latest

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Resolve the latest Texaryn JSON Schema library without changing the package declaration
        run: pnpm --filter @texaryn/schema-json update --latest --no-save @texaryn/json-schema-library
      - name: Show resolved library version
        run: pnpm --filter @texaryn/schema-json list @texaryn/json-schema-library
      - name: Run schema adapter and conformance suites
        run: pnpm exec vitest run --project=schema-json --project=conformance
