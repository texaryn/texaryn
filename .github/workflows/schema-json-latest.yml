name: JSON Schema library latest

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Allow the pinned patch to be unused during the latest check
        run: pnpm config set --location=project allowUnusedPatches true
      - name: Resolve the latest library without changing the package declaration
        run: pnpm --filter @texaryn/schema-json update --latest --no-save json-schema-library
      - name: Run schema adapter and conformance suites
        run: pnpm exec vitest run --project=schema-json --project=conformance
