name: Setup
description: Install pnpm and Node, restore cache, install dependencies

inputs:
  registry-url:
    description: npm registry URL (set for publishing)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - run: pnpm install --frozen-lockfile
      shell: bash
