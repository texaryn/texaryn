sonar.organization=texaryn
sonar.projectKey=texaryn_texaryn
sonar.projectName=Texaryn
sonar.sourceEncoding=UTF-8

sonar.sources=packages,apps,scripts
sonar.tests=packages,apps,scripts,tests
sonar.exclusions=**/__tests__/**,**/*.test.*,packages/*/tests/**,**/dist/**,**/node_modules/**,apps/docs/.astro/**,packages/schema-json/spike/**
sonar.test.inclusions=**/__tests__/**,**/*.test.*,packages/*/tests/**,tests/**
# These wrappers register test cases through shared conformance harnesses.
sonar.issue.ignore.multicriteria=conformanceSuites,exampleConformance,frameworkConformance,svelteExampleMatrix
sonar.issue.ignore.multicriteria.conformanceSuites.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.conformanceSuites.resourceKey=tests/conformance/**/*.test.ts
sonar.issue.ignore.multicriteria.exampleConformance.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.exampleConformance.resourceKey=tests/example-conformance/**/*.test.*
sonar.issue.ignore.multicriteria.frameworkConformance.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.frameworkConformance.resourceKey=packages/*/src/__tests__/**/*.test.*
sonar.issue.ignore.multicriteria.svelteExampleMatrix.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.svelteExampleMatrix.resourceKey=packages/svelte/tests/example-matrix.test.ts
# These Hyperjump modules mirror the primary adapter for independent conformance.
sonar.cpd.exclusions=packages/schema-json-hyperjump/src/dialect.ts,packages/schema-json-hyperjump/src/local-pointer-aliases.ts,packages/schema-json-hyperjump/src/resources.ts,packages/schema-json-hyperjump/src/schema-graph.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mirrors the coverage include and exclude lists in vitest.config.ts.
sonar.coverage.exclusions=apps/**,scripts/**,packages/examples/**,**/*.d.ts,**/index.ts,**/types.ts,packages/svelte/src/lib/widget.ts,packages/solid/src/widget.ts,packages/vue/src/widget.ts,packages/web-components/src/widget.ts,packages/core/src/schema/**,packages/core/src/hints/**
